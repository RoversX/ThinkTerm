# Homebrew. Written for ThinkTerm from brew's own output, which is English
# only. `brew` is a shell script that hands over to Ruby, so the program
# shows up under either name.

id = "brew"
programs = ["brew", "brew.rb", "brew.sh"]

# sudo asking for the password, as a cask's installer needs it partway
# through: "==> Running installer for … with `sudo` (which may request your
# password)...", then "Password:" (or "[sudo] password for user:" on Linux).
[[rules]]
id = "password"
state = "waiting"
priority = 300
region = "bottom_non_empty_lines(1)"
line_regex = ['^Password:\s*$', '^\[sudo[^\]]*\] .*[:：]\s*$']

# "Error: node: no bottle available!"
[[rules]]
id = "error"
state = "error"
priority = 200
region = "bottom_non_empty_lines(3)"
line_regex = ['^Error: ']

# curl's bar while a bottle downloads one at a time: "#########     36.4%".
[[rules]]
id = "download_progress"
priority = 120
region = "bottom_non_empty_lines(1)"
line_regex = ['^[#O=\-\s]*#[#O=\-\s]*\s(?P<percent>\d{1,3})(?:\.\d+)?%\s*$']

# Downloads in parallel (brew's default), a line each, redrawn in place
# under a heading ("==> Fetching downloads for: node and ripgrep"):
# "⠋ Bottle node (21.0.0)   ######      Downloading  10.0MB/ 25.0MB",
# "✔︎ Bottle ripgrep (14.1.1)            Downloaded    2.1MB/  2.1MB".
# Together they say how far the whole lot is, until all of it is down. One
# whose size is not known yet ("1.2MB/-------") is counted, but not its size.
# A narrow pane cuts the name short; a bottle's manifest ("Bottle Manifest
# node …", the only name in capitals) is not a download of its own.
[[rules]]
id = "parallel_downloads"
priority = 116
sum = true
region = "bottom_non_empty_lines(40)"
after_regex = ['^==> (?:Fetching|Downloading) ']
line_regex = ['^\S+ (?:Bottle|Formula|Resource|Cask|Patch) [^\sA-Z].*\s(?:Downloading|Downloaded|Verifying|Verified|Extracting)\s+(?P<done_size>[\d.]+ ?[KMGT]?B)/\s*(?:(?P<total_size>[\d.]+ ?[KMGT]?B)|-+)\s*$']
detail = "{lines_done} of {lines} downloaded"

# "==> Pouring node--21.0.0.arm64_sonoma.bottle.tar.gz"
[[rules]]
id = "pouring"
priority = 110
region = "bottom_non_empty_lines(4)"
line_regex = ['^==> Pouring (?P<name>.+?)--']
detail = "Installing {name}"

# "==> Downloading https://ghcr.io/v2/homebrew/core/node/blobs/sha256:…"
[[rules]]
id = "downloading"
priority = 105
region = "bottom_non_empty_lines(4)"
line_regex = ['^==> Downloading \S+/(?P<name>[^/\s]+)/(?:blobs|manifests)/']
detail = "Downloading {name}"

# "==> Upgrading node", "==> Installing node", "==> Fetching node"
[[rules]]
id = "step"
priority = 100
region = "bottom_non_empty_lines(6)"
line_regex = ['^==> (?P<verb>Upgrading|Installing|Fetching) (?P<name>[A-Za-z][\w@+.-]*)\s*$']
detail = "{verb} {name}"
