<rect x="878" y="182.5" width="68" height="28" rx="14" class="win"/>
<text x="912" y="201.5" class="win-t" text-anchor="middle">8.7×</text>
<text x="350" y="267.5" class="label" text-anchor="end">Unicode 文字</text>
<rect x="372" y="244" width="301.4" height="16" rx="8.0" class="ours-bar"/>
<text x="681.4" y="256.5" class="val-ours">192.4</text>
<rect x="372" y="265" width="73.2" height="16" rx="8.0" class="theirs"/>
<text x="453.2" y="277.5" class="val-theirs">46.7</text>
<rect x="878" y="248.5" width="68" height="28" rx="14" class="win"/>
<text x="912" y="267.5" class="win-t" text-anchor="middle">4.1×</text>
<text x="350" y="333.5" class="label" text-anchor="end">複数コードポイントの Unicode セル</text>
<rect x="372" y="310" width="314.7" height="16" rx="8.0" class="ours-bar"/>
<text x="694.7" y="322.5" class="val-ours">200.9</text>
<rect x="372" y="331" width="77.2" height="16" rx="8.0" class="theirs"/>
<text x="457.2" y="343.5" class="val-theirs">49.3</text>
<rect x="878" y="314.5" width="68" height="28" rx="14" class="win"/>
<text x="912" y="333.5" class="win-t" text-anchor="middle">4.1×</text>
<text x="350" y="399.5" class="label" text-anchor="end">文字の少ない CSI シーケンス</text>
<rect x="372" y="376" width="142.4" height="16" rx="8.0" class="ours-bar"/>
<text x="522.4" y="388.5" class="val-ours">90.9</text>
<rect x="372" y="397" width="24.4" height="16" rx="8.0" class="theirs"/>
<text x="404.4" y="409.5" class="val-theirs">15.6</text>
<rect x="878" y="380.5" width="68" height="28" rx="14" class="win"/>
<text x="912" y="399.5" class="win-t" text-anchor="middle">5.8×</text>
<text x="350" y="465.5" class="label" text-anchor="end">長いエスケープシーケンス</text>
<rect x="372" y="442" width="343.6" height="16" rx="8.0" class="ours-bar"/>
<text x="723.6" y="454.5" class="val-ours">219.3</text>
<rect x="372" y="463" width="305.3" height="16" rx="8.0" class="theirs"/>
<text x="685.3" y="475.5" class="val-theirs">194.9</text>
<rect x="878" y="446.5" width="68" height="28" rx="14" class="win"/>
<text x="912" y="465.5" class="win-t" text-anchor="middle">1.1×</text>
<text x="350" y="531.5" class="label" text-anchor="end">画像</text>
<rect x="372" y="508" width="339.0" height="16" rx="8.0" class="ours-bar"/>
<text x="719.0" y="520.5" class="val-ours">216.4</text>
<rect x="372" y="529" width="423.8" height="16" rx="8.0" class="theirs"/>
<text x="803.8" y="541.5" class="val-theirs">270.5</text>
<rect x="878" y="512.5" width="68" height="28" rx="14" class="even"/>
<text x="912" y="531.5" class="even-t" text-anchor="middle">0.80×</text>
<text x="500" y="636" class="caption" text-anchor="middle">ThinkTerm はローカル mux を有効にして計測：シェルは mux サーバーで動き、出力は mux を経由してウィンドウに届きます。</text>
</svg>
