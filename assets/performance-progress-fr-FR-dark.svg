<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 738" width="1000" height="738" role="img" aria-labelledby="t d">
<title id="t">ThinkTerm au fil des versions</title>
<desc id="d">kitten __benchmark__ · Mac · M1 Pro · Mo/s, plus c’est élevé, mieux c’est. Caractères ASCII uniquement: ThinkTerm early 45,3, ThinkTerm 0.3.0 133,0, ThinkTerm 0.4.1 134,0 (3,0×); Caractères Unicode: ThinkTerm early 52,2, ThinkTerm 0.3.0 104,5, ThinkTerm 0.4.1 109,2 (2,1×); Cellules Unicode à plusieurs points de code: ThinkTerm early 67,8, ThinkTerm 0.3.0 197,5, ThinkTerm 0.4.1 234,4 (3,5×); Séquences CSI avec peu de caractères: ThinkTerm early 25,7, ThinkTerm 0.3.0 49,5, ThinkTerm 0.4.1 53,5 (2,1×); Longues séquences d’échappement: ThinkTerm early 219,4, ThinkTerm 0.3.0 213,8, ThinkTerm 0.4.1 257,3 (1,2×); Images: ThinkTerm early 218,0, ThinkTerm 0.3.0 257,2, ThinkTerm 0.4.1 271,0 (1,2×).</desc>
