<rect x="397" y="508" width="413.0" height="16" rx="8.0" class="ours-bar"/>
<text x="818.0" y="520.5" class="val-ours">278,4</text>
<rect x="397" y="529" width="401.2" height="16" rx="8.0" class="theirs"/>
<text x="806.2" y="541.5" class="val-theirs">270,5</text>
<rect x="878" y="512.5" width="68" height="28" rx="14" class="even"/>
<text x="912" y="531.5" class="even-t" text-anchor="middle">1,0×</text>
<text x="500" y="636" class="caption" text-anchor="middle">ThinkTerm mesuré avec son mux local : le shell tourne dans le serveur mux, et sa sortie passe par le mux avant la fenêtre.</text>
</svg>
