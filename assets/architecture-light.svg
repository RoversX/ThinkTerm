<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" role="img" aria-labelledby="t d">
<title id="t">ThinkTerm Simplified Architecture</title>
<desc id="d">Four clients, the desktop app, the TUI and CLI, a browser and the phone apps, all show the same workspace. Below them, every machine runs the same ThinkTerm mux server with its own plugins and keeps its own sessions; any client can attach to any of them, machines can reach each other, and the desktop app also reaches plain SSH and Mosh hosts. There is no cloud and no central server.</desc>
<defs>
<linearGradient id="mux" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f6ff"/><stop offset="1" stop-color="#dde9ff"/></linearGradient>
<linearGradient id="plug" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7ee"/><stop offset="1" stop-color="#ffe7cf"/></linearGradient>
<filter id="lift" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity="0.08"/></filter>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #1d1d1f; }
.headline { font-size: 32px; font-weight: 700; letter-spacing: -0.6px; }
.subhead { font-size: 16px; fill: #6e6e73; }
.caption { font-size: 13.5px; font-weight: 500; fill: #86868b; }
.label { font-size: 15px; font-weight: 600; }
.machine { font-size: 14px; font-weight: 600; fill: #6e6e73; }
.tile-title { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
.tile-sub { font-size: 12.5px; fill: #6e6e73; }
.chip-t { font-size: 13px; font-weight: 600; fill: #e06c00; }
.frame { fill: #ffffff; stroke: #c7c7cc; filter: url(#lift); }
.base { fill: #d1d1d6; }
.app { fill: #ffffff; stroke: #c7c7cc; filter: url(#lift); }
.app-ink { stroke: #1d1d1f; }
.phone { fill: #000000; stroke: #c7c7cc; filter: url(#lift); }
.button { fill: #c7c7cc; }
.status { font-size: 3.9px; font-weight: 600; fill: #f5f5f7; }
.url { fill: #f5f5f7; }
.platter { fill: #f5f5f7; stroke: #e3e3e8; }
.plain { fill: #ffffff; stroke: #b8b8bf; stroke-dasharray: 5 4; }
.mux-edge { stroke: #c4d7f6; }
.plug-edge { stroke: #f4cda4; }
.pill { fill: #ffffff; stroke: #dcdce1; }
.pill-t { font-size: 11.5px; font-weight: 500; fill: #6e6e73; }
.glyph { fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mux-ink { stroke: #0071e3; }
.plug-ink { stroke: #e06c00; }
.plain-ink { stroke: #6e6e73; }
.weave { fill: none; stroke: #c7c7cc; stroke-width: 1.2; stroke-linecap: round; }
.dashed { stroke-dasharray: 5 5; }
</style>
