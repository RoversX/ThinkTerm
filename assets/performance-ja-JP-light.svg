<text x="350" y="465.5" class="label" text-anchor="end">長いエスケープシーケンス</text>
<rect x="372" y="442" width="403.1" height="16" rx="8.0" class="ours-bar"/>
<text x="783.1" y="454.5" class="val-ours">257.3</text>
<rect x="372" y="463" width="305.3" height="16" rx="8.0" class="theirs"/>
<text x="685.3" y="475.5" class="val-theirs">194.9</text>
<rect x="878" y="446.5" width="68" height="28" rx="14" class="win"/>
<text x="912" y="465.5" class="win-t" text-anchor="middle">1.3×</text>
<text x="350" y="531.5" class="label" text-anchor="end">画像</text>
<rect x="372" y="508" width="424.6" height="16" rx="8.0" class="ours-bar"/>
<text x="804.6" y="520.5" class="val-ours">271.0</text>
<rect x="372" y="529" width="423.8" height="16" rx="8.0" class="theirs"/>
<text x="803.8" y="541.5" class="val-theirs">270.5</text>
<rect x="878" y="512.5" width="68" height="28" rx="14" class="even"/>
<text x="912" y="531.5" class="even-t" text-anchor="middle">1.0×</text>
<text x="500" y="636" class="caption" text-anchor="middle">ThinkTerm はローカル mux を有効にして計測：シェルは mux サーバーで動き、出力は mux を経由してウィンドウに届きます。</text>
</svg>
