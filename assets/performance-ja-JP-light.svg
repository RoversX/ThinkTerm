<text x="350" y="267.5" class="label" text-anchor="end">Unicode 文字</text>
<rect x="372" y="244" width="171.1" height="16" rx="8.0" class="ours-bar"/>
<text x="551.1" y="256.5" class="val-ours">109.2</text>
<rect x="372" y="265" width="73.2" height="16" rx="8.0" class="theirs"/>
<text x="453.2" y="277.5" class="val-theirs">46.7</text>
<rect x="878" y="248.5" width="68" height="28" rx="14" class="win"/>
<text x="912" y="267.5" class="win-t" text-anchor="middle">2.3×</text>
<text x="350" y="333.5" class="label" text-anchor="end">複数コードポイントの Unicode セル</text>
<rect x="372" y="310" width="367.2" height="16" rx="8.0" class="ours-bar"/>
<text x="747.2" y="322.5" class="val-ours">234.4</text>
<rect x="372" y="331" width="77.2" height="16" rx="8.0" class="theirs"/>
<text x="457.2" y="343.5" class="val-theirs">49.3</text>
<rect x="878" y="314.5" width="68" height="28" rx="14" class="win"/>
<text x="912" y="333.5" class="win-t" text-anchor="middle">4.8×</text>
