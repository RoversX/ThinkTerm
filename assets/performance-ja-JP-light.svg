<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" role="img" aria-labelledby="t d">
<title id="t">ThinkTerm vs WezTerm</title>
<desc id="d">kitten __benchmark__ · Mac · M1 Pro · MB/s、大きいほど高速. ASCII 文字のみ: ThinkTerm 134.0, WezTerm 23.6 (5.7×); Unicode 文字: ThinkTerm 109.2, WezTerm 46.7 (2.3×); 複数コードポイントの Unicode セル: ThinkTerm 234.4, WezTerm 49.3 (4.8×); 文字の少ない CSI シーケンス: ThinkTerm 53.5, WezTerm 15.6 (3.4×); 長いエスケープシーケンス: ThinkTerm 257.3, WezTerm 194.9 (1.3×); 画像: ThinkTerm 271.0, WezTerm 270.5 (1.0×).</desc>
<defs>
<linearGradient id="ours" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0071e3"/><stop offset="1" stop-color="#2b8cff"/></linearGradient>
<filter id="glow" x="-10%" y="-80%" width="120%" height="300%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0071e3" flood-opacity="0.28"/></filter>
</defs>
<style>
text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', sans-serif; fill: #1d1d1f; }
.headline { font-size: 32px; font-weight: 700; letter-spacing: -0.6px; }
.subhead { font-size: 16px; fill: #6e6e73; }
.label { font-size: 15px; font-weight: 600; letter-spacing: -0.1px; }
.legend { font-size: 13.5px; font-weight: 500; fill: #6e6e73; }
.val-ours { font-size: 13px; font-weight: 700; }
.val-theirs { font-size: 12.5px; font-weight: 500; fill: #6e6e73; }
.tick { font-size: 11.5px; fill: #86868b; }
.caption { font-size: 13px; font-weight: 500; fill: #86868b; }
.grid { stroke: #ececf0; stroke-width: 1; }
.axis { stroke: #d2d2d7; stroke-width: 1.2; }
.ours { fill: url(#ours); }
.ours-bar { fill: url(#ours); filter: url(#glow); }
.theirs { fill: #c7c7cc; }
.win { fill: #e8f1ff; stroke: #c4d7f6; }
.win-t { font-size: 14px; font-weight: 700; fill: #0071e3; }
.even { fill: #f5f5f7; stroke: #e3e3e8; }
.even-t { font-size: 14px; font-weight: 700; fill: #6e6e73; }
</style>
<rect x="0.5" y="0.5" width="999" height="669" rx="28" fill="#ffffff" stroke="#d2d2d7"/>
<text x="500" y="62" class="headline" text-anchor="middle">ThinkTerm vs WezTerm</text>
<text x="500" y="92" class="subhead" text-anchor="middle">kitten __benchmark__ · Mac · M1 Pro · MB/s、大きいほど高速</text>
<rect x="372" y="122" width="22" height="12" rx="6" class="ours"/>
<text x="402" y="132" class="legend">ThinkTerm 0.4.1 · 2026-11-04</text>
<rect x="628" y="122" width="22" height="12" rx="6" class="theirs"/>
