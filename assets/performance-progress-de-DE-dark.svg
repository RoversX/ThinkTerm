<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 738" width="1000" height="738" role="img" aria-labelledby="t d">
<title id="t">ThinkTerm über die Versionen</title>
<desc id="d">kitten __benchmark__ · Mac · M1 Pro · MB/s, höher ist besser. Nur ASCII-Zeichen: ThinkTerm early 45,3, ThinkTerm 0.3.0 133,0, ThinkTerm 0.4.1 134,0 (3,0×); Unicode-Zeichen: ThinkTerm early 52,2, ThinkTerm 0.3.0 104,5, ThinkTerm 0.4.1 109,2 (2,1×); Unicode-Zellen aus mehreren Codepoints: ThinkTerm early 67,8, ThinkTerm 0.3.0 197,5, ThinkTerm 0.4.1 234,4 (3,5×); CSI-Sequenzen mit wenigen Zeichen: ThinkTerm early 25,7, ThinkTerm 0.3.0 49,5, ThinkTerm 0.4.1 53,5 (2,1×); Lange Escape-Sequenzen: ThinkTerm early 219,4, ThinkTerm 0.3.0 213,8, ThinkTerm 0.4.1 257,3 (1,2×); Bilder: ThinkTerm early 218,0, ThinkTerm 0.3.0 257,2, ThinkTerm 0.4.1 271,0 (1,2×).</desc>
