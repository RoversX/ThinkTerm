<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" width="1000" height="1020" role="img" aria-labelledby="t d">
<title id="t">ThinkTerm от версии к версии</title>
<desc id="d">kitten __benchmark__ · Mac · M1 Pro · МБ/с, больше — лучше. Только символы ASCII: early 45,3, 0.3.0 133,0, 0.4.1 134,0, 0.4.2 206,1, 0.4.3 221,4 (4,9×); Символы Unicode: early 52,2, 0.3.0 104,5, 0.4.1 109,2, 0.4.2 192,4, 0.4.3 193,2 (3,7×); Ячейки Unicode из нескольких кодовых точек: early 67,8, 0.3.0 197,5, 0.4.1 234,4, 0.4.2 200,9, 0.4.3 285,3 (4,2×); CSI-последовательности с малым числом символов: early 25,7, 0.3.0 49,5, 0.4.1 53,5, 0.4.2 90,9, 0.4.3 89,9 (3,5×); Длинные escape-последовательности: early 219,4, 0.3.0 213,8, 0.4.1 257,3, 0.4.2 219,3, 0.4.3 278,6 (1,3×); Изображения: early 218,0, 0.3.0 257,2, 0.4.1 271,0, 0.4.2 216,4, 0.4.3 278,4 (1,3×).</desc>
