name: verify-pages

on:
  workflow_dispatch:

# Automatic triggers are intentionally disabled for this fork.
# Original upstream trigger block:
# on:
#   pull_request:
#     branches:
#       - main
#     paths:
#       - "docs/**"
#       - "ci/build-docs.sh"
#       - "ci/generate-docs.py"
#       - "ci/subst-release-info.py"
#       - ".github/workflows/verify-pages.yml"
# 
jobs:
  build-docs:
    env:
      BUILD_REASON: "PR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@stable
      - name: Install gelatyx
        uses: baptiste0928/cargo-install@v2
        with:
          crate: gelatyx
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - uses: actions/cache@v4
        with:
          key: ${{ github.ref }}
          path: .cache
      - name: Build
        run: ./ci/build-docs.sh

