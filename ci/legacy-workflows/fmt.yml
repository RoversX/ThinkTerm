name: fmt

on:
  workflow_dispatch:

# Automatic triggers are intentionally disabled for this fork.
# Original upstream trigger block:
# on:
#   pull_request:
#     branches:
#       - main
#     paths:
#       - "**/*.rs"
#       - ".github/workflows/fmt.yml"
#   push:
#     branches:
#       - main
#     paths:
#       - "**/*.rs"
#       - ".github/workflows/fmt.yml"
# 
jobs:
  check-code-formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: "Install Rust"
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: Build
        run: |
          source $HOME/.cargo/env
          cargo +nightly fmt --all -- --check


