[package]
name = "thinkterm-mobile"
version = "0.1.0"
edition = "2021"
publish = false

# The native-shell side of the mobile client: a core thread that owns the
# GPU state, the session and (later) the App; a Send handle the shells call
# through UniFFI; and the platform seams -- a surface from a CAMetalLayer or
# an ANativeWindow, ssh as the transport, the shell's fonts for the glyphs
# the bundled faces lack. S0/S0.5 scope: the thread model, the surface
# lifecycle, and one real pane over ssh.

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
codec.workspace = true
futures.workspace = true
log.workspace = true
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
# For making keys: ssh-key's generator wants a rand_core 0.10 RNG.
rand_core = "0.10"
ring = "0.17"
# The tab icon cards' glyphs, drawn into masks the shell tints.
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
# The path of an uploaded file, quoted for a shell as the desktop quotes it.
shlex.workspace = true
# The tailnet's login link as a code another device's camera scans (`qr`).
qrcode.workspace = true
termwiz = { workspace = true, features = ["use_serde"] }
thinkterm-font-core.workspace = true
# An agent's conversation as a chat: the bridge's lines and the view of them.
thinkterm-agent-chat = { workspace = true, features = ["view"] }
# The app's own node in a tailnet (`tailnet`), where the library runs: a
# phone has no mux server to hold one for it, as a desktop has.
thinkterm-tailnet-engine = { workspace = true, features = ["node"] }
thinkterm-font-web.workspace = true
thinkterm-proto.workspace = true
thinkterm-render = { workspace = true, features = ["wgpu"] }
thinkterm-session.workspace = true
thinkterm-tab-icons.workspace = true
thinkterm-web.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net", "io-util"] }
uniffi = { workspace = true, features = ["cli"] }
wezterm-color-types.workspace = true
wezterm-term = { workspace = true, features = ["use_serde"] }
wgpu.workspace = true

# The Android shell hands over a java.lang.Surface; the native window
# behind it, and logcat, are NDK calls.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "0.3"
ndk-sys = "0.5"
raw-window-handle.workspace = true

[dev-dependencies]
tempfile.workspace = true
