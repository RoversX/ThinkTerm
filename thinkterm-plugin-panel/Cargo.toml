[package]
name = "thinkterm-plugin-panel"
version = "0.1.0"
edition = "2021"
publish = false

# A plugin's panel in the right sidebar: the picture a plugin draws, what it
# is told back, and the player every ThinkTerm client shows the picture with.
# Plain data and arithmetic, so it builds anywhere, WebAssembly included.

[dependencies]
base64 = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["raw_value"] }
