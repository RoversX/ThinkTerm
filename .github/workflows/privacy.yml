name: privacy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the guard
        run: python3 -m unittest discover -s ci -p 'test_privacy_guard.py'
      - name: Check tracked content
        run: python3 ci/check-privacy.py --tree HEAD
