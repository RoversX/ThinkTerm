# Builds the Windows and Linux halves of a ThinkTerm release.
#
# Run it from the Actions tab: name a version, tick the platforms, tick publish.
# It leaves a draft release holding those packages; the macOS zip is signed and
# notarized on a laptop by ci/macos-package.sh and attached to that draft by
# hand, and publishing the draft from the web UI is what creates the tag.
#
# The packaging itself lives in ci/deploy.sh and ci/appimage.sh; this file only
# decides what to build, on which runner, and what to do with the results.

name: release

on:
  # Deliberately not `push: tags`. The tag does not exist until the draft this
  # workflow leaves behind is published, so triggering on it would start a
  # second, redundant build of a release that is already out -- and race that
  # build's uploads against the finished one.
  workflow_dispatch:
    inputs:
      # Blank keeps ci/tag-name.sh's build timestamp, which identifies a build
      # rather than a release: wezterm-gui's update check refuses to order a
      # timestamp against a v0.1.0-style tag, so nobody is ever offered one as
      # an update. Name a version for anything users are meant to receive.
      version:
        description: 'Version, e.g. 0.1.0 (blank = timestamped test build)'
        type: string
        default: ''
      # Off by default: this runner has no Developer ID certificate, so
      # ci/deploy.sh falls back to an ad-hoc signature that Gatekeeper refuses.
      # Release builds are produced locally with ci/macos-package.sh instead.
      macos_arm64:
        description: macOS arm64 (no certificate here -- ad-hoc signed only)
        type: boolean
        default: false
      macos_x86_64:
        description: macOS x86_64 (no certificate here -- ad-hoc signed only)
        type: boolean
        default: false
      windows_x86_64:
        description: Windows x86_64
        type: boolean
        default: true
      linux_x86_64:
        description: Linux x86_64 (deb + rpm + AppImage + tarballs)
        type: boolean
        default: true
      # arm64 hosted runners are free on public repos only. Ticking this on a
      # private repo fails the leg, and the publish gate below refuses to ship
      # a release with any failed job -- so it would build everything and
      # publish nothing. Turn it on once the repo is public.
      linux_arm64:
        description: Linux arm64 (public repos only -- leave off while private)
        type: boolean
        default: false
      publish:
        description: Publish to a GitHub Release (otherwise artifacts only)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_INCREMENTAL: '0'

jobs:
  # Resolves one build plan for every downstream job. Computing the version
  # here rather than per-job matters: ci/tag-name.sh derives it from the
  # current time, so eight runners would otherwise stamp eight different
  # versions onto the same release.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      publish: ${{ steps.plan.outputs.publish }}
      windows: ${{ steps.plan.outputs.windows }}
      macos_matrix: ${{ steps.plan.outputs.macos_matrix }}
      linux_matrix: ${{ steps.plan.outputs.linux_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version reaches the script through env rather than a ${{ }} splice:
      # it is free text from the Run workflow form, and spliced inline a value
      # containing quotes or $(...) would run as shell in a job holding
      # contents: write and a token. The booleans below cannot carry a payload.
      - name: Resolve build plan
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$INPUT_VERSION"
          if [ -n "$version" ]; then
            # A leading v is accepted and dropped. Nothing downstream wants
            # one: deb and rpm version fields reject it outright, Homebrew
            # expects a bare version, and the `tags: v*` trigger that used to
            # require it is gone. One form, in the tag and in every filename.
            version="${version#v}"
            # This becomes a filename that ci/deploy.sh builds paths from and
            # hands to rm -rf. Same character rule as ci/macos-package.sh.
            case "$version" in
              *[!A-Za-z0-9._-]*)
                echo "::error::refusing version '$version': letters, digits, dot, underscore and dash only"
                exit 1
                ;;
            esac
            release_tag="$version"
          else
            release_tag="$(bash ci/tag-name.sh)"
            version="$release_tag"
          fi

          publish='${{ inputs.publish }}'
          # macOS is signed, notarized and stapled locally by
          # ci/macos-package.sh, because the Developer ID certificate lives in
          # a keychain rather than in this repo's secrets. Anything built here
          # is ad-hoc signed: well-formed, but refused by Gatekeeper on every
          # Mac but this runner, and billed at the 10x macOS rate to produce.
          macos_arm64='${{ inputs.macos_arm64 }}'
          macos_x86_64='${{ inputs.macos_x86_64 }}'
          windows='${{ inputs.windows_x86_64 }}'
          linux_x86_64='${{ inputs.linux_x86_64 }}'
          linux_arm64='${{ inputs.linux_arm64 }}'

          macos_matrix="$(jq -nc \
            --argjson a "$macos_arm64" --argjson x "$macos_x86_64" '
            [ if $a then {arch: "arm64",  target: "aarch64-apple-darwin"} else empty end,
              if $x then {arch: "x86_64", target: "x86_64-apple-darwin"}  else empty end ]')"

          linux_matrix="$(jq -nc \
            --argjson x "$linux_x86_64" --argjson a "$linux_arm64" '
            # Only two package formats are needed. glibc is forward compatible
            # only, so building the deb on the oldest base we support (22.04,
            # glibc 2.35) also covers Ubuntu 24.04, Debian 12/13 and their
            # derivatives -- a separate Debian 12 build would ship a strictly
            # less portable deb with the same dependencies.
            [ {name: "ubuntu22.04", container: "ubuntu:22.04", appimage: true},
              {name: "fedora41",    container: "fedora:41",    appimage: false} ] as $distros
            | [ if $x then {arch: "x86_64", runs_on: "ubuntu-latest"}    else empty end,
                if $a then {arch: "arm64",  runs_on: "ubuntu-24.04-arm"} else empty end ] as $arches
            | [ $distros[] as $d | $arches[] as $r | $d + $r ]')"

          {
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "publish=$publish"
            echo "windows=$windows"
            echo "macos_matrix=$macos_matrix"
            echo "linux_matrix=$linux_matrix"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$version\` |"
            echo "| release tag | \`$release_tag\` |"
            echo "| publish | \`$publish\` |"
            echo "| macOS | \`$(jq -r 'if length == 0 then "none" else [.[].arch] | join(", ") end' <<<"$macos_matrix")\` |"
            echo "| Windows | \`$windows\` |"
            echo "| Linux | \`$(jq -r 'if length == 0 then "none" else [.[] | "\(.name)/\(.arch)"] | join(", ") end' <<<"$linux_matrix")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # One job per architecture, each producing its own zip. We deliberately do not
  # lipo them into a universal bundle: that doubles the download for an Intel
  # audience that is on its way out.
  # The browser client is the same bytes on every platform, so it is built
  # once here and dropped into each package's tree before ci/deploy.sh. It
  # was not built anywhere in this workflow before: deploy.sh copies the
  # bundle only when it exists, so every package shipped without a page and
  # the server logged "no web bundle found".
  web:
    name: web bundle
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Submodules too: thinkterm-web `include_str!`s its icons from
      # third_party/lucide, so a bare checkout fails to compile it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check submodules
        run: bash ci/check-submodules.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # The wasm-bindgen CLI has to match the crate the workspace pins
      # exactly (ci/build-web.sh refuses any other), so its version is read
      # from Cargo.toml rather than written here twice. The prebuilt binary
      # takes seconds where `cargo install` takes minutes. binaryen is
      # wasm-opt, which takes a quarter off the wasm.
      #
      # Retried, because this job gates all three packaging jobs: a GitHub
      # release 502 or an apt mirror hiccup would otherwise take the whole
      # release with it.
      - name: Install wasm-bindgen and wasm-opt
        run: |
          set -euo pipefail
          version=$(grep -E '^wasm-bindgen = "=' Cargo.toml | sed -E 's/.*"=([0-9.]+)".*/\1/')
          dir="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          bash ci/retry.sh bash -c "curl -sSfL \
            'https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/${dir}.tar.gz' \
            | tar -xz -C \"\$HOME/.cargo/bin\" --strip-components=1 '${dir}/wasm-bindgen'"
          bash ci/retry.sh sudo apt-get update
          bash ci/retry.sh sudo apt-get install -y --no-install-recommends binaryen
          wasm-bindgen --version
          wasm-opt --version

      # The page around the terminal is built by Vite from thinkterm-web/ui.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: thinkterm-web/ui/package-lock.json

      - name: Build
        run: bash ci/build-web.sh

      - name: Type-check the page
        run: npm run --prefix thinkterm-web/ui check

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: thinkterm-web/www
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macos ${{ matrix.arch }}
    needs: [prepare, web]
    if: needs.prepare.outputs.macos_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.macos_matrix) }}
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      TAG_NAME: ${{ needs.prepare.outputs.version }}
      MACOS_ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check submodules
        run: bash ci/check-submodules.sh

      # wezterm-version's build.rs prefers a `.tag` file over deriving the
      # version from git. Without it a released binary reports a commit stamp,
      # and wezterm-gui's update check compares that against a `v*` release tag
      # -- two unrelated schemes, so every release looks newer forever.
      # Via env rather than a ${{ }} splice: it derives from free text typed
      # into the Run workflow form, which the plan step validates but does not
      # quote for every later use.
      - name: Stamp version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: echo "$RELEASE_TAG" > .tag

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Caches are ref-scoped and a tag run can only read its own ref plus the
      # default branch, so writing from tags would produce entries nothing ever
      # restores. Save from main, restore everywhere.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-${{ matrix.arch }}-dist
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Install system deps
        run: env CI=yes PATH=$PATH ./get-deps

      - name: Build
        run: |
          cargo build --profile dist --target ${{ matrix.target }} \
            -p wezterm \
            -p wezterm-gui \
            -p wezterm-mux-server \
            -p thinkterm-plugin-server \
            -p strip-ansi-escapes

      - name: Fetch the browser bundle
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: thinkterm-web/www

      # Without signing credentials ci/deploy.sh falls back to an ad-hoc
      # signature: the bundle is well-formed but Gatekeeper will still warn on
      # another machine.
      - name: Package
        env:
          MACOS_APPLEID: ${{ secrets.MACOS_APPLEID }}
          MACOS_APP_PW: ${{ secrets.MACOS_APP_PW }}
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          MACOS_CERT_PW: ${{ secrets.MACOS_CERT_PW }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          CARGO_PROFILE: dist
        run: bash ci/deploy.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ThinkTerm-macos-*.zip
            !ThinkTerm-macos-*-dSYM.zip
          if-no-files-found: error
          retention-days: 7

      # The symbols stay a workflow artifact (kept 90 days), not a release
      # asset: nobody but us reads a crash report against them, and on the
      # release page they would only look like another download.
      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-symbols
          path: ThinkTerm-macos-*-dSYM.zip
          if-no-files-found: error

  windows:
    name: windows x86_64
    needs: [prepare, web]
    if: needs.prepare.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      RUSTUP_WINDOWS_PATH_ADD_BIN: '1'
      TAG_NAME: ${{ needs.prepare.outputs.version }}
      # dist's concurrent fat-LTO builds exhausted the Windows runner's memory.
      # Keep the previous release profile until dist is validated here again.
      # Build, packaging, cache selection and symbol upload share this value.
      CARGO_PROFILE: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check submodules
        shell: bash
        run: bash ci/check-submodules.sh

      # See the macOS job: without this a released binary reports a commit
      # stamp rather than the release tag, and the update check compares two
      # unrelated version schemes.
      - name: Stamp version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: echo "$RELEASE_TAG" > .tag

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-x86_64-${{ env.CARGO_PROFILE }}
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # ci/deploy.sh calls iscc.exe unconditionally, so a missing Inno Setup
      # would only surface after a 25 minute build.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) {
              choco install innosetup -y --no-progress
            }
            Add-Content -Path $env:GITHUB_PATH -Value $inno
          }

      # openssl-src needs perl; Strawberry Perl ships on the runner but is not
      # on PATH by default.
      - name: Build
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --profile %CARGO_PROFILE% -p wezterm -p wezterm-gui -p wezterm-mux-server -p thinkterm-plugin-server -p strip-ansi-escapes

      - name: Fetch the browser bundle
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: thinkterm-web/www

      - name: Package
        shell: bash
        run: bash ci/deploy.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: |
            ThinkTerm-*.zip
            !ThinkTerm-*-pdb.zip
            ThinkTerm-*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload symbols
        # The ordinary release profile does not produce a separate PDB bundle.
        if: env.CARGO_PROFILE == 'dist'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-symbols
          path: ThinkTerm-*-pdb.zip
          if-no-files-found: error

  # Each distro builds inside its own container so the resulting deb/rpm links
  # against that distro's glibc, and the arch comes from the runner underneath.
  linux:
    name: ${{ matrix.name }} ${{ matrix.arch }}
    needs: [prepare, web]
    if: needs.prepare.outputs.linux_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.linux_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container }}
    timeout-minutes: 90

    env:
      TAG_NAME: ${{ needs.prepare.outputs.version }}
      # Every Linux leg builds with the release profile. Fedora kept dist
      # so that CI could revalidate it, and that is now answered: fat LTO
      # with a single codegen unit links wezterm-gui in one process too
      # large for a standard runner, and the job was killed at 78 minutes
      # -- inside the 90 minute limit, and with no log uploaded -- while
      # the release leg finished in 28. dist is still what the macOS
      # packaging builds with. Packaging and AppImage must read the same
      # profile directory as the build and cache steps.
      CARGO_PROFILE: release
      # Job-wide, not per-step: ./get-deps pulls in tzdata and friends, and a
      # debconf prompt there would hang until timeout-minutes with no output.
      DEBIAN_FRONTEND: noninteractive

    steps:
      # git has to exist before actions/checkout runs, otherwise it silently
      # falls back to downloading a tarball -- and then there is no .git for
      # ci/deploy.sh to read, and no submodules either.
      - name: Bootstrap container
        run: |
          set -eu
          if command -v apt-get >/dev/null 2>&1 ; then
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates curl git xz-utils
          else
            # Not `curl`: the fedora image ships curl-minimal, which already
            # provides /usr/bin/curl, and dnf refuses to swap them without
            # --allowerasing.
            dnf install -y ca-certificates git rpm-build
          fi

      - name: Allow git to read the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check submodules
        run: bash ci/check-submodules.sh

      # wezterm-version's build.rs prefers a `.tag` file over deriving the
      # version from git. Without it a released binary reports a commit stamp,
      # and wezterm-gui's update check compares that against a `v*` release tag
      # -- two unrelated schemes, so every release looks newer forever.
      # Via env rather than a ${{ }} splice: it derives from free text typed
      # into the Run workflow form, which the plan step validates but does not
      # quote for every later use.
      - name: Stamp version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: echo "$RELEASE_TAG" > .tag

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned
        with:
          toolchain: stable

      # rust-cache keys on the job id, which is just "linux" for all six legs.
      # Without an explicit key a fedora job would happily restore a target dir
      # built inside ubuntu, and whichever leg finishes first wins the write
      # while the others burn minutes compressing an entry they cannot save.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}-${{ matrix.arch }}-${{ env.CARGO_PROFILE }}
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Install system deps
        run: env CI=yes PATH=$PATH ./get-deps

      - name: Build
        run: |
          cargo build --profile "$CARGO_PROFILE" \
            -p wezterm \
            -p wezterm-gui \
            -p wezterm-mux-server \
            -p thinkterm-plugin-server \
            -p strip-ansi-escapes

      - name: Fetch the browser bundle
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: thinkterm-web/www

      - name: Package
        run: bash ci/deploy.sh

      - name: Collect RPMs
        if: startsWith(matrix.name, 'fedora')
        run: mv "$HOME"/rpmbuild/RPMS/*/*.rpm .

      - name: Build AppImage
        if: matrix.appimage
        run: |
          set -eu
          apt-get install -y --no-install-recommends file zsync
          bash ci/appimage.sh

      # The .zsync pattern matters: ci/appimage.sh embeds an update URL that
      # points at that file, so leaving it behind makes every AppImageUpdate
      # check resolve to a 404. if-no-files-found applies to the pattern list
      # as a whole, so the distros that build no AppImage are unaffected.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-${{ matrix.arch }}
          path: |
            thinkterm-*.deb
            thinkterm-*.tar.xz
            thinkterm-*.tar.gz
            thinkterm-*.rpm
            ThinkTerm-*.AppImage
            ThinkTerm-*.AppImage.zsync
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [prepare, macos, windows, linux]
    # Runs even when some platforms were deselected (those jobs report as
    # skipped), but never after a real failure -- half a release is worse than
    # none.
    if: >-
      !cancelled()
      && needs.prepare.outputs.publish == 'true'
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # No checksum files are published. GitHub records a sha256 for every
      # release asset as it is uploaded -- including the macOS zip attached by
      # hand -- and shows it on the asset. A checksums file of our own would
      # cover only what CI built, and unsigned it sits on the same server as
      # the packages, so it proves no more than the digest already does.
      - name: Check there is something to publish
        run: |
          set -eu
          # A plan with every platform deselected reaches this job with nothing
          # downloaded. Stop here rather than let ci/create-release.sh mint an
          # empty draft on the default branch.
          # The symbol zips are workflow artifacts for reading crash
          # reports, not downloads: keep them off the release page.
          rm -f dist/*-dSYM.zip dist/*-pdb.zip
          [ -d dist ] && [ -n "$(ls -A dist)" ] \
            || { echo "::error::no artifacts to publish"; exit 1; }
          ls -l dist

      # The tag reaches these steps through env rather than a ${{ }} splice into
      # the script body. It derives from free text typed into the Run workflow
      # form -- spliced inline, a value containing quotes or $(...) would run
      # as shell in a job holding contents: write and a token.
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bash ci/retry.sh bash ci/create-release.sh "$RELEASE_TAG"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          bash ci/retry.sh gh release upload --clobber \
            "$RELEASE_TAG" dist/*
