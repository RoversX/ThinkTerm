# Builds the Windows and Linux halves of a ThinkTerm release.
#
# Run it from the Actions tab: name a version, tick the platforms, tick publish.
# It leaves a draft release holding those packages; the macOS zip is signed and
# notarized on a laptop by ci/macos-package.sh and attached to that draft by
# hand, and publishing the draft from the web UI is what creates the tag.
#
# The packaging itself lives in ci/deploy.sh and ci/appimage.sh; this file only
# decides what to build, on which runner, and what to do with the results.

name: release

on:
  # Deliberately not `push: tags`. The tag does not exist until the draft this
  # workflow leaves behind is published, so triggering on it would start a
  # second, redundant build of a release that is already out -- and race that
  # build's uploads against the finished one.
  workflow_dispatch:
    inputs:
      # Blank keeps ci/tag-name.sh's build timestamp, which identifies a build
      # rather than a release: wezterm-gui's update check refuses to order a
      # timestamp against a v0.1.0-style tag, so nobody is ever offered one as
      # an update. Name a version for anything users are meant to receive.
      version:
        description: 'Version, e.g. 0.1.0 (blank = timestamped test build)'
        type: string
        default: ''
      # dist adds fat LTO and writes the symbols beside the binaries (.dSYM,
      # .pdb): smaller binaries, but a much slower build. Every platform
      # builds with the one chosen here.
      profile:
        description: Build profile (release = faster build, dist = smaller binaries + crash symbols, slow)
        type: choice
        options:
          - release
          - dist
        default: release
      # Signed with the Developer ID certificate and notarized once the run is
      # approved for the release environment, whose secrets hold both.
      macos_arm64:
        description: macOS arm64 (signed and notarized)
        type: boolean
        default: true
      macos_x86_64:
        description: macOS x86_64 (signed and notarized)
        type: boolean
        default: true
      windows_x86_64:
        description: Windows x86_64
        type: boolean
        default: true
      # Same terms as linux_arm64 below: free on public repos only.
      windows_arm64:
        description: Windows arm64
        type: boolean
        default: true
      linux_x86_64:
        description: Linux x86_64 (deb + rpm + AppImage + tarballs)
        type: boolean
        default: true
      # arm64 hosted runners are free on public repos only; a fork that is
      # private fails this leg, and the publish gate below then ships nothing.
      linux_arm64:
        description: Linux arm64 (deb + rpm + AppImage + tarballs)
        type: boolean
        default: true
      publish:
        description: Publish to a GitHub Release (otherwise artifacts only)
        type: boolean
        default: false

# Runs that publish the same version queue behind one another, so two never
# upload to the same release; other versions and test builds each get a group
# of their own and run side by side.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.publish && format('publish-{0}', inputs.version) || github.run_id }}

env:
  CARGO_INCREMENTAL: '0'

jobs:
  # Resolves one build plan for every downstream job. Computing the version
  # here rather than per-job matters: ci/tag-name.sh derives it from the
  # current time, so eight runners would otherwise stamp eight different
  # versions onto the same release.
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      publish: ${{ steps.plan.outputs.publish }}
      windows_matrix: ${{ steps.plan.outputs.windows_matrix }}
      macos_matrix: ${{ steps.plan.outputs.macos_matrix }}
      linux_matrix: ${{ steps.plan.outputs.linux_matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The version reaches the script through env rather than a ${{ }} splice:
      # it is free text from the Run workflow form, and spliced inline a value
      # containing quotes or $(...) would run as shell in a job holding
      # contents: write and a token. The booleans below cannot carry a payload.
      - name: Resolve build plan
        id: plan
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="$INPUT_VERSION"
          if [ -n "$version" ]; then
            # A leading v is accepted and dropped. Nothing downstream wants
            # one: deb and rpm version fields reject it outright, Homebrew
            # expects a bare version, and the `tags: v*` trigger that used to
            # require it is gone. One form, in the tag and in every filename.
            version="${version#v}"
            # This becomes a filename that ci/deploy.sh builds paths from and
            # hands to rm -rf. Same character rule as ci/macos-package.sh.
            case "$version" in
              *[!A-Za-z0-9._-]*)
                echo "::error::refusing version '$version': letters, digits, dot, underscore and dash only"
                exit 1
                ;;
            esac
            release_tag="$version"
          else
            release_tag="$(bash ci/tag-name.sh)"
            version="$release_tag"
          fi

          publish='${{ inputs.publish }}'
          macos_arm64='${{ inputs.macos_arm64 }}'
          macos_x86_64='${{ inputs.macos_x86_64 }}'
          windows_x86_64='${{ inputs.windows_x86_64 }}'
          windows_arm64='${{ inputs.windows_arm64 }}'
          linux_x86_64='${{ inputs.linux_x86_64 }}'
          linux_arm64='${{ inputs.linux_arm64 }}'

          macos_matrix="$(jq -nc \
            --argjson a "$macos_arm64" --argjson x "$macos_x86_64" '
            [ if $a then {arch: "arm64",  target: "aarch64-apple-darwin"} else empty end,
              if $x then {arch: "x86_64", target: "x86_64-apple-darwin"}  else empty end ]')"

          windows_matrix="$(jq -nc \
            --argjson x "$windows_x86_64" --argjson a "$windows_arm64" '
            [ if $x then {arch: "x86_64", runs_on: "windows-2022",   target: "x86_64-pc-windows-msvc"}  else empty end,
              if $a then {arch: "arm64",  runs_on: "windows-11-arm", target: "aarch64-pc-windows-msvc"} else empty end ]')"

          linux_matrix="$(jq -nc \
            --argjson x "$linux_x86_64" --argjson a "$linux_arm64" '
            # Only two package formats are needed. glibc is forward compatible
            # only, so building the deb on the oldest base we support (22.04,
            # glibc 2.35) also covers Ubuntu 24.04, Debian 12/13 and their
            # derivatives -- a separate Debian 12 build would ship a strictly
            # less portable deb with the same dependencies.
            # 20.04 builds only the server tarball, OpenSSL built in, for
            # hosts older than 22.04: they have only OpenSSL 1.1.
            [ {name: "ubuntu22.04", container: "ubuntu:22.04", appimage: true},
              {name: "ubuntu20.04", container: "ubuntu:20.04", appimage: false, old_glibc: true},
              {name: "fedora41",    container: "fedora:41",    appimage: false} ] as $distros
            | [ if $x then {arch: "x86_64", runs_on: "ubuntu-latest"}    else empty end,
                if $a then {arch: "arm64",  runs_on: "ubuntu-24.04-arm"} else empty end ] as $arches
            | [ $distros[] as $d | $arches[] as $r | $d + $r ]')"

          {
            echo "version=$version"
            echo "release_tag=$release_tag"
            echo "publish=$publish"
            echo "windows_matrix=$windows_matrix"
            echo "macos_matrix=$macos_matrix"
            echo "linux_matrix=$linux_matrix"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build plan"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| version | \`$version\` |"
            echo "| release tag | \`$release_tag\` |"
            echo "| publish | \`$publish\` |"
            echo "| macOS | \`$(jq -r 'if length == 0 then "none" else [.[].arch] | join(", ") end' <<<"$macos_matrix")\` |"
            echo "| Windows | \`$(jq -r 'if length == 0 then "none" else [.[].arch] | join(", ") end' <<<"$windows_matrix")\` |"
            echo "| Linux | \`$(jq -r 'if length == 0 then "none" else [.[] | "\(.name)/\(.arch)"] | join(", ") end' <<<"$linux_matrix")\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # One job per architecture, each producing its own zip. We deliberately do not
  # lipo them into a universal bundle: that doubles the download for an Intel
  # audience that is on its way out.
  # The browser client is the same bytes on every platform, so it is built
  # once here and dropped into each package's tree before ci/deploy.sh. It
  # was not built anywhere in this workflow before: deploy.sh copies the
  # bundle only when it exists, so every package shipped without a page and
  # the server logged "no web bundle found".
  web:
    name: web bundle
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Submodules too: thinkterm-web `include_str!`s its icons from
      # third_party/lucide, so a bare checkout fails to compile it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check submodules
        run: bash ci/check-submodules.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: web
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # The wasm-bindgen CLI has to match the crate the workspace pins
      # exactly (ci/build-web.sh refuses any other), so its version is read
      # from Cargo.toml rather than written here twice. The prebuilt binary
      # takes seconds where `cargo install` takes minutes. binaryen is
      # wasm-opt, which takes a quarter off the wasm. It is pinned to an
      # upstream release rather than taken from apt: Ubuntu 24.04's binaryen
      # 108 points the __wbindgen_externrefs export at the fixed-size funcref
      # table, and the page then fails to start.
      #
      # Retried, because this job gates all three packaging jobs: a GitHub
      # release 502 would otherwise take the whole release with it.
      - name: Install wasm-bindgen and wasm-opt
        run: |
          set -euo pipefail
          version=$(grep -E '^wasm-bindgen = "=' Cargo.toml | sed -E 's/.*"=([0-9.]+)".*/\1/')
          dir="wasm-bindgen-${version}-x86_64-unknown-linux-musl"
          bash ci/retry.sh bash -c "curl -sSfL \
            'https://github.com/rustwasm/wasm-bindgen/releases/download/${version}/${dir}.tar.gz' \
            | tar -xz -C \"\$HOME/.cargo/bin\" --strip-components=1 '${dir}/wasm-bindgen'"
          binaryen=version_133
          bash ci/retry.sh bash -c "curl -sSfL \
            'https://github.com/WebAssembly/binaryen/releases/download/${binaryen}/binaryen-${binaryen}-x86_64-linux.tar.gz' \
            | tar -xz -C \"\$HOME/.cargo/bin\" --strip-components=2 'binaryen-${binaryen}/bin/wasm-opt'"
          wasm-bindgen --version
          wasm-opt --version

      # The page around the terminal is built by Vite from thinkterm-web/ui.
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: thinkterm-web/ui/package-lock.json

      - name: Build
        run: bash ci/build-web.sh

      - name: Type-check the page
        run: npm run --prefix thinkterm-web/ui check

      - name: Test the page
        run: npm test --prefix thinkterm-web/ui

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: thinkterm-web/www
          if-no-files-found: error
          retention-days: 3

  macos:
    name: macos ${{ matrix.arch }}
    needs: [prepare, web]
    if: needs.prepare.outputs.macos_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.macos_matrix) }}
    runs-on: macos-latest
    timeout-minutes: 90
    # The signing certificate and the notarization key are this
    # environment's secrets: a run only reaches them once it is approved.
    environment: release

    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      TAG_NAME: ${{ needs.prepare.outputs.version }}
      MACOS_ARCH: ${{ matrix.arch }}
      CARGO_PROFILE: ${{ inputs.profile || 'release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check submodules
        run: bash ci/check-submodules.sh

      # A secret set wrong fails here, a minute in, rather than after the
      # build. Prints nothing of the secrets.
      - name: Check signing credentials
        env:
          MACOS_APPLEID: ${{ secrets.MACOS_APPLEID }}
          MACOS_APP_PW: ${{ secrets.MACOS_APP_PW }}
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          MACOS_CERT_PW: ${{ secrets.MACOS_CERT_PW }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: bash ci/macos-check-signing.sh

      # wezterm-version's build.rs prefers a `.tag` file over deriving the
      # version from git. Without it a released binary reports a commit stamp,
      # and wezterm-gui's update check compares that against a `v*` release tag
      # -- two unrelated schemes, so every release looks newer forever.
      # Via env rather than a ${{ }} splice: it derives from free text typed
      # into the Run workflow form, which the plan step validates but does not
      # quote for every later use.
      - name: Stamp version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: echo "$RELEASE_TAG" > .tag

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Caches are ref-scoped and a tag run can only read its own ref plus the
      # default branch, so writing from tags would produce entries nothing ever
      # restores. Save from main, restore everywhere.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-${{ matrix.arch }}-${{ env.CARGO_PROFILE }}
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Install system deps
        run: env CI=yes PATH=$PATH ./get-deps

      - name: Build
        run: |
          cargo build --profile "$CARGO_PROFILE" --target ${{ matrix.target }} \
            -p wezterm \
            -p wezterm-gui \
            -p wezterm-mux-server \
            -p thinkterm-plugin-server \
            -p thinkterm-tailnet-node \
            -p strip-ansi-escapes

      - name: Fetch the browser bundle
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: thinkterm-web/www

      # Without signing credentials ci/deploy.sh falls back to an ad-hoc
      # signature: the bundle is well-formed but Gatekeeper will still warn on
      # another machine.
      - name: Package
        env:
          MACOS_APPLEID: ${{ secrets.MACOS_APPLEID }}
          MACOS_APP_PW: ${{ secrets.MACOS_APP_PW }}
          MACOS_CERT: ${{ secrets.MACOS_CERT }}
          MACOS_CERT_PW: ${{ secrets.MACOS_CERT_PW }}
          MACOS_TEAM_ID: ${{ secrets.MACOS_TEAM_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          # The app reports Info.plist's version to its update check, so a
          # named release writes its version there, as ci/macos-package.sh
          # does; one that disagrees with its tag offers itself as an update
          # on every launch. A timestamped test build leaves it alone.
          MACOS_BUNDLE_VERSION: ${{ inputs.version != '' && needs.prepare.outputs.version || '' }}
        run: bash ci/deploy.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ThinkTerm-macos-*.zip
            !ThinkTerm-macos-*-dSYM.zip
          if-no-files-found: error
          retention-days: 3

      # The symbols stay a workflow artifact (kept 3 days), not a release
      # asset: nobody but us reads a crash report against them, and on the
      # release page they would only look like another download.
      - name: Upload symbols
        # Only dist writes the .dSYM bundle.
        if: env.CARGO_PROFILE == 'dist'
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}-symbols
          path: ThinkTerm-macos-*-dSYM.zip
          if-no-files-found: error
          retention-days: 3

  windows:
    name: windows ${{ matrix.arch }}
    needs: [prepare, web]
    if: needs.prepare.outputs.windows_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.windows_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90

    env:
      RUSTUP_WINDOWS_PATH_ADD_BIN: '1'
      TAG_NAME: ${{ needs.prepare.outputs.version }}
      WINDOWS_ARCH: ${{ matrix.arch }}
      # Build, packaging, cache selection and symbol upload share this value.
      CARGO_PROFILE: ${{ inputs.profile || 'release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check submodules
        shell: bash
        run: bash ci/check-submodules.sh

      # See the macOS job: without this a released binary reports a commit
      # stamp rather than the release tag, and the update check compares two
      # unrelated version schemes.
      - name: Stamp version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: echo "$RELEASE_TAG" > .tag

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # The build below targets the host, so an x86_64 toolchain on the arm
      # runner would quietly package the emulated build instead.
      - name: Check host
        shell: bash
        run: |
          rustc -vV
          [ "$(rustc -vV | sed -n 's/^host: //p')" = '${{ matrix.target }}' ]

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-${{ matrix.arch }}-${{ env.CARGO_PROFILE }}
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # ci/deploy.sh calls iscc.exe unconditionally, so a missing Inno Setup
      # would only surface after a 25 minute build.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (-not (Test-Path "$inno\ISCC.exe")) {
              choco install innosetup -y --no-progress
            }
            Add-Content -Path $env:GITHUB_PATH -Value $inno
          }

      # Before the build: wezterm-gui's build script stages these next to the
      # executables, and the installer takes them from there.
      - name: Fetch the arm64 DLLs
        if: matrix.arch == 'arm64'
        shell: bash
        run: bash ci/windows-arm64-assets.sh

      # openssl-src needs perl; Strawberry Perl ships on the runner but is not
      # on PATH by default.
      - name: Build
        shell: cmd
        run: |
          PATH C:\Strawberry\perl\bin;%PATH%
          cargo build --profile %CARGO_PROFILE% -p wezterm -p wezterm-gui -p thinkterm-connect-auth -p wezterm-mux-server -p thinkterm-plugin-server -p strip-ansi-escapes

      - name: Fetch the browser bundle
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: thinkterm-web/www

      - name: Package
        shell: bash
        run: bash ci/deploy.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            ThinkTerm-*.zip
            !ThinkTerm-*-pdb.zip
            ThinkTerm-*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Upload symbols
        # The ordinary release profile does not produce a separate PDB bundle.
        if: env.CARGO_PROFILE == 'dist'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}-symbols
          path: ThinkTerm-*-pdb.zip
          if-no-files-found: error
          retention-days: 3

  # Each distro builds inside its own container so the resulting deb/rpm links
  # against that distro's glibc, and the arch comes from the runner underneath.
  linux:
    name: ${{ matrix.name }} ${{ matrix.arch }}
    needs: [prepare, web]
    if: needs.prepare.outputs.linux_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.linux_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container }}
    timeout-minutes: 90

    env:
      TAG_NAME: ${{ needs.prepare.outputs.version }}
      # Packaging and AppImage must read the same profile directory as the
      # build and cache steps.
      CARGO_PROFILE: ${{ inputs.profile || 'release' }}
      # Job-wide, not per-step: ./get-deps pulls in tzdata and friends, and a
      # debconf prompt there would hang until timeout-minutes with no output.
      DEBIAN_FRONTEND: noninteractive
      # The 20.04 leg: build, check and pack the old-glibc server alone.
      OLD_GLIBC_SERVER: ${{ matrix.old_glibc && '1' || '' }}

    steps:
      # git has to exist before actions/checkout runs, otherwise it silently
      # falls back to downloading a tarball -- and then there is no .git for
      # ci/deploy.sh to read, and no submodules either.
      - name: Bootstrap container
        run: |
          set -eu
          if command -v apt-get >/dev/null 2>&1 ; then
            apt-get update
            apt-get install -y --no-install-recommends \
              ca-certificates curl git xz-utils
          else
            # Not `curl`: the fedora image ships curl-minimal, which already
            # provides /usr/bin/curl, and dnf refuses to swap them without
            # --allowerasing.
            dnf install -y ca-certificates git rpm-build
          fi

      - name: Allow git to read the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check submodules
        run: bash ci/check-submodules.sh

      # wezterm-version's build.rs prefers a `.tag` file over deriving the
      # version from git. Without it a released binary reports a commit stamp,
      # and wezterm-gui's update check compares that against a `v*` release tag
      # -- two unrelated schemes, so every release looks newer forever.
      # Via env rather than a ${{ }} splice: it derives from free text typed
      # into the Run workflow form, which the plan step validates but does not
      # quote for every later use.
      - name: Stamp version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: echo "$RELEASE_TAG" > .tag

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, pinned
        with:
          toolchain: stable

      # rust-cache keys on the job id, which is just "linux" for every leg.
      # Without an explicit key a fedora job would happily restore a target dir
      # built inside ubuntu, and whichever leg finishes first wins the write
      # while the others burn minutes compressing an entry they cannot save.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}-${{ matrix.arch }}-${{ env.CARGO_PROFILE }}
          cache-on-failure: true
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Install system deps
        run: env CI=yes PATH=$PATH ./get-deps

      # One cargo build for every program: features unify across it, so the
      # 20.04 leg's vendored-openssl on the mux server reaches them all.
      - name: Build
        run: |
          if [ -n "$OLD_GLIBC_SERVER" ]; then
            cargo build --profile "$CARGO_PROFILE" \
              -p wezterm \
              -p wezterm-mux-server \
              -p thinkterm-plugin-server \
              -p thinkterm-tailnet-node \
              -p strip-ansi-escapes \
              --features wezterm-mux-server/vendored-openssl
          else
            cargo build --profile "$CARGO_PROFILE" \
              -p wezterm \
              -p wezterm-gui \
              -p thinkterm-connect-auth \
              -p wezterm-mux-server \
              -p thinkterm-plugin-server \
              -p thinkterm-tailnet-node \
              -p strip-ansi-escapes
          fi

      # install.sh, and the clients that install over ssh, let a host in by
      # the glibc each variant needs; the tarballs they install come from
      # the Ubuntu legs, so their binaries are held to those numbers.
      - name: Check glibc floors
        if: startsWith(matrix.name, 'ubuntu')
        run: bash ci/check-glibc.sh "target/$CARGO_PROFILE" ${OLD_GLIBC_SERVER:+old-server}

      - name: Fetch the browser bundle
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: thinkterm-web/www

      - name: Package
        run: bash ci/deploy.sh

      - name: Collect RPMs
        if: startsWith(matrix.name, 'fedora')
        run: mv "$HOME"/rpmbuild/RPMS/*/*.rpm .

      - name: Build AppImage
        if: matrix.appimage
        run: |
          set -eu
          apt-get install -y --no-install-recommends file zsync
          bash ci/appimage.sh

      # The .zsync pattern matters: ci/appimage.sh embeds an update URL that
      # points at that file, so leaving it behind makes every AppImageUpdate
      # check resolve to a 404. if-no-files-found applies to the pattern list
      # as a whole, so the distros that build no AppImage are unaffected.
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-${{ matrix.arch }}
          path: |
            thinkterm-*.deb
            thinkterm-*.tar.xz
            thinkterm-*.tar.gz
            thinkterm-*.rpm
            ThinkTerm-*.AppImage
            ThinkTerm-*.AppImage.zsync
          if-no-files-found: error
          retention-days: 3

  publish:
    name: publish
    needs: [prepare, macos, windows, linux]
    # Runs even when some platforms were deselected (those jobs report as
    # skipped), but never after a real failure -- half a release is worse than
    # none.
    if: >-
      !cancelled()
      && needs.prepare.outputs.publish == 'true'
      && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      # web-bundle is the browser client the packages were built with, not a
      # download of its own: merged in with them, its directories and loose
      # files land in dist/ and the upload refuses a directory. Each artifact
      # arrives in its own directory, so it is left out by name.
      - name: Gather the packages
        run: |
          set -eu
          rm -rf artifacts/web-bundle
          mkdir -p artifacts dist
          find artifacts -type f -exec mv -t dist {} +

      - name: Check there is something to publish
        run: |
          set -eu
          # A plan with every platform deselected reaches this job with nothing
          # downloaded. Stop here rather than let ci/create-release.sh mint an
          # empty draft on the default branch.
          # The symbol zips are workflow artifacts for reading crash
          # reports, not downloads: keep them off the release page.
          rm -f dist/*-dSYM.zip dist/*-pdb.zip
          [ -d dist ] && [ -n "$(ls -A dist)" ] \
            || { echo "::error::no artifacts to publish"; exit 1; }
          ls -l dist

      # The tag reaches these steps through env rather than a ${{ }} splice into
      # the script body. It derives from free text typed into the Run workflow
      # form -- spliced inline, a value containing quotes or $(...) would run
      # as shell in a job holding contents: write and a token.
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bash ci/retry.sh bash ci/create-release.sh "$RELEASE_TAG"

      # A rerun may build only one platform. Keep the other release assets in
      # the signed inventory, without uploading or replacing them again.
      - name: Gather existing release packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/thinkterm-existing-release"
          mkdir -p "$previous"
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/thinkterm-assets.txt"
          while IFS= read -r name; do
            case "$name" in
              thinkterm-release.txt|thinkterm-release.txt.sig|*-dSYM.zip|*-pdb.zip) continue ;;
              ""|*[!A-Za-z0-9._+-]*) echo "::error::unexpected release asset name"; exit 1 ;;
            esac
            [ ! -f "dist/$name" ] || continue
            gh release download "$RELEASE_TAG" --pattern "$name" --dir "$previous"
          done < "$RUNNER_TEMP/thinkterm-assets.txt"

      - name: Sign release metadata
        env:
          THINKTERM_RELEASE_SIGNING_KEY: ${{ secrets.THINKTERM_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bash ci/sign-release.sh "$RELEASE_TAG" dist "$RUNNER_TEMP/thinkterm-existing-release"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          packages=()
          for file in dist/*; do
            case "$file" in dist/thinkterm-release.txt|dist/thinkterm-release.txt.sig) continue ;; esac
            packages+=("$file")
          done
          bash ci/retry.sh gh release upload --clobber "$RELEASE_TAG" "${packages[@]}"
          bash ci/retry.sh gh release upload --clobber "$RELEASE_TAG" \
            dist/thinkterm-release.txt dist/thinkterm-release.txt.sig
