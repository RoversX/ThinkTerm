name: Bug Report Form
description: Create a report to help us improve
labels: [bug]
assignees: []
body:
  - type: dropdown
    id: os
    attributes:
      label: What Operating System(s) are you seeing this problem on?
      multiple: true
      options:
        - Windows
        - Linux X11
        - Linux Wayland
        - macOS
    validations:
      required: true
  - type: textarea
    id: window_manager
    attributes:
      label: Which Wayland compositor or X11 Window manager(s) are you using?
      description: |
        If running on a unix system, please include the name and version of the compositor/WM.
        Windows and macOS typically can leave this blank, but if you are using additional window
        management software on top of the standard for those systems, please indicate that here.
      placeholder: "ex: Sway, Mutter, wayfire, i3."
  - type: textarea
    id: version
    attributes:
      label: ThinkTerm version
      description: |
        Open Settings → About, click Copy Info and paste it here. Delete its
        Config and Data lines first: they show your home folder.
        If ThinkTerm will not open, run `thinkterm -V` and paste its output instead.
      placeholder: |
        ThinkTerm 0.1.1
        Build: 0.1.1
        Target: x86_64-pc-windows-msvc
        OS: windows
      render: text
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is
      placeholder: Tell us what happened
    validations:
      required: true
  - type: textarea
    id: to_repro
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        Please include as much information as possible that can help to reproduce and
        understand the issue.
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: |
        What you changed in Settings, and the relevant section(s) of your `thinkterm.lua`
        configuration file if you have one. You can enter "defaults" if you changed neither.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If possible, activate the Debug Overlay by pressing CTRL-SHIFT-L and then copy
        and paste the log lines in here. If you launched ThinkTerm from
        the command line, copy and paste that output here.
        You can also find log files, named `thinkterm-gui-log-<pid>.txt`, in
        `$XDG_RUNTIME_DIR/thinkterm` on Linux, `~/.local/share/thinkterm` on macOS
        and `%USERPROFILE%\.local\share\thinkterm` on Windows.
        If ThinkTerm crashed on macOS, attach the crash report from
        `~/Library/Logs/DiagnosticReports` whose name starts with `thinkterm-gui`.
  - type: textarea
    id: other
    attributes:
      label: Anything else?
      description: |
        Add any other context about the problem here.  You can attach screenshots by clicking
        this area to highlight it and then drag the files in, or just paste the image from
        the clipboard to upload it.
