[package]
name = "thinkterm-plugin-stocks"
version = "0.1.0"
edition = "2021"
publish = false

# An example ThinkTerm plugin with a panel: a watchlist of quotes from Yahoo
# Finance, and a chart of the one picked. Its dependencies name their
# versions rather than the workspace's, so the directory builds on its own
# once the SDK path below points at a checkout of ThinkTerm.

[dependencies]
anyhow = "1.0"
http_req = "0.11"
serde_json = "1.0"
thinkterm-plugin-sdk = { path = "../../thinkterm-plugin-sdk" }
