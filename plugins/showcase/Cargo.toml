[package]
name = "thinkterm-plugin-showcase"
version = "0.1.0"
edition = "2021"
publish = false

# A ThinkTerm plugin that shows what a plugin's page can draw: a tour of
# sections, each a real-looking tool built from rectangles, text, lines,
# areas, hits, scroll areas, lists and fields. Its dependencies name their
# versions rather than the workspace's, so the directory builds on its own
# once the SDK path below points at a checkout of ThinkTerm.

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
thinkterm-plugin-sdk = { path = "../../thinkterm-plugin-sdk" }
