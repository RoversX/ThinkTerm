# xcodegen spec for the iOS app: a SwiftUI shell around the Rust core
# (thinkterm-mobile, linked as a static library) that drives a CAMetalLayer
# through the UniFFI bindings in Generated/. `ios/build.sh` regenerates the
# bindings and the project and builds for the simulator.
name: ThinkTerm
options:
  bundleIdPrefix: com.roversx.thinkterm
  # iOS 26: the liquid-glass look is the app's own from there on, and one
  # system is what the app is tried on.
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  # The developer's own signing team, untracked; see ios/build.sh.
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  ThinkTerm:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Generated
        excludes:
          - "*.h"
          - "*.modulemap"
      # Listed file by file: an iOS bundle is flat, and a folder reference
      # would nest a Resources/ directory the installer rejects.
      - path: Resources
        buildPhase: resources
        excludes:
          - ".gitignore"
      # The app icon, twice over: ThinkTerm.icon is the Icon Composer bundle
      # iOS 26 and later render, and Assets.xcassets carries a plain 1024 PNG
      # for older systems. Both are named ThinkTerm, which is the name
      # ASSETCATALOG_COMPILER_APPICON_NAME below points at.
      # This is the iOS-only bundle (ios/ThinkTerm.icon), not the Mac one in
      # assets/icon: it is a gradient background plus the glass chevron, with
      # no baked squircle, so iOS composites its own liquid-glass shape. The
      # Mac bundle's raster layer would show as a squircle inside a squircle.
      - path: ThinkTerm.icon
        type: file
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
      # Why the app calls the APIs Apple asks a reason for; App Store
      # Connect refuses an upload that calls them without one.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        # The release, as the desktop's: an app speaks to the ThinkTerm of
        # its own release only. `ios/build.sh archive VERSION` sets both;
        # a build made otherwise is 0.0.0 (1).
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone only: an iPad build must allow every orientation, and the
        # app has not been tried on one.
        TARGETED_DEVICE_FAMILY: "1"
        # The launch screen, black (Info.plist); the other keys are below.
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: ThinkTerm
        # Asked when a machine on the same network is first reached: an ssh
        # host there, or a tailnet's machine reached directly rather than
        # through a relay.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: ThinkTerm connects to the machines you add, including ones on your local network.
        PRODUCT_BUNDLE_IDENTIFIER: com.roversx.thinkterm.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: ThinkTerm
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: "5.9"
        # `#file` as "ThinkTerm/File.swift", not the build machine's path:
        # it is what fatalError and the bindings' checks put in the binary.
        SWIFT_UPCOMING_FEATURE_CONCISE_MAGIC_FILE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        # The crate also emits a cdylib (for Android later); naming the .a by
        # path keeps the linker from preferring the .dylib next to it.
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": $(SRCROOT)/../target/aarch64-apple-ios-sim/release/libthinkterm_mobile.a
        "OTHER_LDFLAGS[sdk=iphoneos*]": $(SRCROOT)/../target/aarch64-apple-ios/release/libthinkterm_mobile.a
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          # Signed to run locally, not left unsigned: an unsigned simulator
          # build has no keychain entitlement, and every Keychain call
          # fails with -34018, so no host's key or password would be kept.
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
