# xcodegen spec for the iOS app: a SwiftUI shell around the Rust core
# (thinkterm-mobile, linked as a static library) that drives a CAMetalLayer
# through the UniFFI bindings in Generated/. `ios/build.sh` regenerates the
# bindings and the project and builds for the simulator.
name: ThinkTerm
options:
  bundleIdPrefix: com.roversx.thinkterm
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  # The developer's own signing team, untracked; see ios/build.sh.
  Debug: Local.xcconfig
  Release: Local.xcconfig
targets:
  ThinkTerm:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Generated
        excludes:
          - "*.h"
          - "*.modulemap"
      # Listed file by file: an iOS bundle is flat, and a folder reference
      # would nest a Resources/ directory the installer rejects.
      - path: Resources
        buildPhase: resources
        excludes:
          - ".gitignore"
      # The app icon, twice over: ThinkTerm.icon is the Icon Composer bundle
      # iOS 26 and later render, and Assets.xcassets carries a plain 1024 PNG
      # for older systems. Both are named ThinkTerm, which is the name
      # ASSETCATALOG_COMPILER_APPICON_NAME below points at.
      # This is the iOS-only bundle (ios/ThinkTerm.icon), not the Mac one in
      # assets/icon: it is a gradient background plus the glass chevron, with
      # no baked squircle, so iOS composites its own liquid-glass shape. The
      # Mac bundle's raster layer would show as a squircle inside a squircle.
      - path: ThinkTerm.icon
        type: file
        buildPhase: resources
      - path: Assets.xcassets
        buildPhase: resources
    dependencies:
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: ThinkTerm
        PRODUCT_BUNDLE_IDENTIFIER: com.roversx.thinkterm.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: ThinkTerm
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SWIFT_VERSION: "5.9"
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated
        # The crate also emits a cdylib (for Android later); naming the .a by
        # path keeps the linker from preferring the .dylib next to it.
        "OTHER_LDFLAGS[sdk=iphonesimulator*]": $(SRCROOT)/../target/aarch64-apple-ios-sim/release/libthinkterm_mobile.a
        "OTHER_LDFLAGS[sdk=iphoneos*]": $(SRCROOT)/../target/aarch64-apple-ios/release/libthinkterm_mobile.a
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          # Signed to run locally, not left unsigned: an unsigned simulator
          # build has no keychain entitlement, and every Keychain call
          # fails with -34018, so no host's key or password would be kept.
          "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
