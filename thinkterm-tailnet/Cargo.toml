[package]
name = "thinkterm-tailnet"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# The node itself, for the one process that holds it: `thinkterm-tailnet`
# (thinkterm-tailnet-node). Without it this crate reads and changes the
# settings, reads the node's reports, asks for connections through it, and
# keeps it running -- all the app, `thinkterm` and the mux server need,
# without the library in them.
node = ["thinkterm-tailnet-engine/node", "dep:tokio", "dep:async-io", "dep:tokio-util"]

[dependencies]
anyhow.workspace = true
config.workspace = true
log.workspace = true
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
socket2.workspace = true
thinkterm-core.workspace = true
# The node, and the words for where one is (Status, Peer).
thinkterm-tailnet-engine.workspace = true
url.workspace = true
# Only for the dialer a process registers with it (see use_for_ssh).
wezterm-ssh.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "user"] }

[target.'cfg(windows)'.dependencies]
# The node's socket is AF_UNIX on Windows too (see crate::proxy), through
# the crate the mux server's own socket goes through there.
wezterm-uds.workspace = true
# Waiting for the node's answer without a receive timeout (see
# crate::proxy).
filedescriptor.workspace = true
winapi = { workspace = true, features = [
    "handleapi",
    "processthreadsapi",
    "securitybaseapi",
    "synchapi",
    "winbase",
    "winerror",
    "winnt",
    "winsock2",
] }
# Tokio has no AF_UNIX on Windows: there the node's socket and the
# connections it takes are async-io's, as the mux server's are, handed to
# the node's Tokio side through tokio-util's compat.
async-io = { workspace = true, optional = true }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }

# The library runs on macOS, Linux and Windows only; elsewhere this crate
# builds without it and SUPPORTED says so.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
http_req.workspace = true
# For what runs beside the node on its runtime: the socket the machine's
# other processes ask it on.
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }

[dev-dependencies]
tempfile.workspace = true
