[package]
name = "thinkterm-web"
version = "0.1.0"
edition = "2021"
publish = false

# The browser client: thinkterm-session's PaneSession over a WebSocket,
# drawn through thinkterm-render's shader and quads on a WebGPU canvas,
# with thinkterm-font-web for glyphs. Standards only -- WebGPU, WebSocket,
# wasm -- so it runs in Safari, Chrome and Firefox alike. The page-facing
# code is wasm32-only; the pure logic (key mapping, viewport arithmetic)
# builds and tests natively.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
codec.workspace = true
euclid.workspace = true
futures.workspace = true
guillotiere.workspace = true
log.workspace = true
nucleo-matcher.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
termwiz = { workspace = true, features = ["use_serde"] }
thinkterm-font-core.workspace = true
thinkterm-font-web.workspace = true
thinkterm-i18n.workspace = true
thinkterm-plugin-channel.workspace = true
thinkterm-plugin-panel.workspace = true
thinkterm-proto.workspace = true
thinkterm-render = { workspace = true, features = ["wgpu"] }
thinkterm-session.workspace = true
thinkterm-snippets.workspace = true
thinkterm-tab-icons.workspace = true
wezterm-color-types.workspace = true
wezterm-term = { workspace = true, features = ["use_serde"] }
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
# CanvasRenderingContext2d and ImageData are what the glyph fallback draws
# missing graphemes with (see canvas.rs). TextMetrics is deliberately absent:
# `measureText` only offers an advance, and using an advance as a column
# count would put fallback glyphs on the wrong grid -- leaving the feature
# off makes that mistake unavailable rather than merely discouraged.
web-sys = { workspace = true, features = [
  "BinaryType", "CanvasRenderingContext2d", "Clipboard", "ClipboardEvent",
  "CloseEvent", "CompositionEvent",
  "console", "CssStyleDeclaration", "DataTransfer", "Document", "DomRect",
  "DomRectReadOnly", "Element", "Event", "EventTarget", "FocusEvent",
  "HtmlCanvasElement", "HtmlElement", "HtmlTextAreaElement", "ImageData",
  "InputEvent",
  "KeyboardEvent", "Location", "MessageEvent", "MouseEvent", "Navigator",
  "Performance", "PointerEvent", "ResizeObserver", "ResizeObserverEntry",
  "WebSocket", "WheelEvent", "Window",
] }
