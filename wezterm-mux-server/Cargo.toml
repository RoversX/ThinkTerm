[package]
name = "wezterm-mux-server"
version = "0.1.0"
authors = ["Wez Furlong <wez@wezfurlong.org>"]
edition = "2018"
resolver = "2"
publish = false
autobins = false

# The crate keeps its upstream name so patches still merge; only the produced
# executable is branded.
[[bin]]
name = "thinkterm-mux-server"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
async_ossl.workspace = true
clap.workspace = true
config.workspace = true
env-bootstrap.workspace = true
libc.workspace = true
hdrhistogram.workspace = true
log.workspace = true
metrics.workspace = true
mux.workspace = true
mlua.workspace = true
openssl.workspace = true
portable-pty = { workspace=true, features = ["serde_support"]}
promise.workspace = true
signal-hook.workspace = true
smol.workspace = true
umask.workspace = true
wezterm-blob-leases = {workspace=true, features=["simple_tempdir"]}
wezterm-mux-server-impl.workspace = true
wezterm-gui-subcommands.workspace = true
wezterm-term.workspace = true

[target."cfg(windows)".dependencies]
winapi = { workspace=true, features = [
    "consoleapi",
    "handleapi",
    "minwindef",
    "winbase",
    "winerror",
    "winnt",
    "winuser",
]}

[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true
cc.workspace = true
